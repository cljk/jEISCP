# the rolling eiscp.log is added by LogFile.install(), so tests write no file
log4j.rootCategory=INFO, CONSOLE

log4j.logger.de.csmp=DEBUG
log4j.logger.de.csmp.jeiscp.eiscp.EiscpCommandsParser=INFO

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=[%p,%C{1}] %m%n
